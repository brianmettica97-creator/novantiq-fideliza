# Configuración de Supabase CLI. En producción, revisá los mismos valores en el panel
# (Authentication > URL Configuration / Providers / Rate Limits).
project_id = "novantiq-fideliza"

[api]
schemas = ["public"]
max_rows = 1000

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "https://fideliza.novantiq.com.ar/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
minimum_password_length = 8
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[storage]
file_size_limit = "1MiB"

[functions.billing-webhook]
verify_jwt = false

[functions.billing-checkout]
verify_jwt = true

[functions.billing-cancel]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
